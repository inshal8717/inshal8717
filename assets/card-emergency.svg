<style>
  .mo { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  .nm { font-family: Inter,"Helvetica Neue",Helvetica,"Segoe UI",system-ui,Arial,sans-serif; }

  .rt { animation: rd 8s ease-in-out infinite; }
  .r2 { animation-delay:.5s } .r3 { animation-delay:1.0s } .r4 { animation-delay:1.5s }
  .ring { animation: pr 2.6s ease-out infinite; }
  .ring2 { animation-delay:1.3s }
  .core { animation: cp 2.6s ease-in-out infinite; }
  @keyframes rd { 0%{stroke-dashoffset:var(--l)} 34%,86%{stroke-dashoffset:0;opacity:.95} 100%{stroke-dashoffset:0;opacity:.15} }
  @keyframes pr { 0%{r:9;opacity:.55} 100%{r:46;opacity:0} }
  @keyframes cp { 0%,100%{opacity:.85} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .rt{stroke-dashoffset:0;animation:none} .ring{animation:none;opacity:0} .core{animation:none} }</style>
