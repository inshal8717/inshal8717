<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Responder units routing toward a live incident on a city grid">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080E1B"/><stop offset="1" stop-color="#0E1728"/></linearGradient>

